  catSave:function(){var n=$('t-n').value.trim();if(!n)return toast('Dê um nome à categoria.');var m=M(),c=F.id&&m.cats.find(function(x){return x.id===F.id});if(c){c.nome=n;c.cor=corSel()}else m.cats.push({id:'c-'+uid(),nome:n,tipo:F.tipo,cor:corSel()});close();mark('meta')},
  catDel:function(btn){if(!two('cat',btn,'Toque de novo: as transações ficam sem categoria'))return;var m=M(),id=F.id;m.cats=m.cats.filter(function(c){return c.id!==id});delete m.orc[id];close();mark('meta')},
  planilha:function(){
    if(!need())return;if(!M().contas.length){toast('Cadastre uma conta antes de importar.');return A.conta()}
    F={k:'pl'};F_edit=true;PL=null;
    modal('<h2>Importar planilha</h2><div class="mut">Escolha um arquivo do Excel (.xlsx ou .xls), do Google Planilhas, do LibreOffice (.ods) ou um CSV, como o extrato ou a fatura que o banco deixa baixar. O app reconhece as colunas e mostra tudo antes de importar.</div><label class="btn" style="flex:none;align-self:flex-start;flex-direction:row;color:#fff;font-size:15px;cursor:pointer">Escolher arquivo<input type="file" id="pl-f" accept=".xlsx,.xls,.xlsm,.ods,.csv,.txt,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" onchange="A.plFile(this)" hidden></label><div class="sm mut">Não sabe como montar? <button class="lk" onclick="A.modelo()">Baixe a planilha modelo</button>, preencha e importe.</div><div id="pl-v"></div>');
  },
  plFile:async function(inp0){
    var f=inp0.files&&inp0.files[0];if(!f)return;var v=$('pl-v');v.innerHTML='<div class="note">Lendo a planilha…</div>';
    try{
      var X=await loadXLSX(),buf=await f.arrayBuffer(),wb;
      if(/\.(csv|txt)$/i.test(f.name)){
        var txt=new TextDecoder('utf-8').decode(buf);if(txt.indexOf('�')>-1)txt=new TextDecoder('windows-1252').decode(buf);txt=txt.replace(/^﻿/,'');
        var l1=txt.split(/\r?\n/)[0]||'',fs=[';','\t',','].sort(function(a,b){return l1.split(b).length-l1.split(a).length})[0];
        wb=X.read(txt,{type:'string',FS:fs,raw:true});
      }else wb=X.read(buf,{type:'array'});
      var sh=wb.SheetNames.filter(function(n){var r=X.utils.sheet_to_json(wb.Sheets[n],{header:1,blankrows:false});return r.length>1});
      if(!sh.length){v.innerHTML='<div class="note e">A planilha está vazia.</div>';return}
      PL={wb:wb,nome:f.name,sheets:sh};plLoad(sh[0]);plView();
    }catch(e){v.innerHTML='<div class="note e">'+(XL===null&&!window.XLSX?'Não foi possível carregar o leitor de planilhas. Verifique a internet e tente de novo.':'Não consegui ler este arquivo. Salve como .xlsx ou .csv e tente de novo.')+'</div>'}
  },
  plAba:function(n){plLoad(n);plView()},
  plSet:function(k,f,v){if(!PL)return;if(k==='map')PL.cfg.map[f]=parseInt(v,10);else PL.cfg[k]=v;if(k==='src'&&v.charAt(0)==='k'&&PL.cfg.modo==='sinal'&&PL.cfg.map.tipo<0)PL.cfg.modo='todasdesp';if(k==='src'&&v.charAt(0)==='c'&&PL.cfg.modo==='todasdesp')PL.cfg.modo='sinal';if(k==='map')PL.abrirCols=true;plView()},
  plGo:function(){
    var r=plParse(),it=r.items,m=M();if(!it.length)return;
    var made={};Object.keys(r.newCats).forEach(function(k){var x=r.newCats[k],c={id:'c-'+uid(),nome:x[1].slice(0,40),tipo:x[0],cor:PAL[m.cats.length%PAL.length]};m.cats.push(c);made[k]=c.id});
    hold++;var last='';
    it.forEach(function(x){
      var t;if(x.t==='t')t={id:uid(),t:'t',v:x.v,d:x.d,desc:x.desc,cat:'',conta:x.src.slice(2),cartao:'',dest:x.dest,pago:true};
      else if(x.t==='f')t={id:uid(),t:'f',v:x.v,d:x.d,desc:'',cat:'',conta:x.src.slice(2),cartao:x.kid,dest:'',pago:true,fym:x.d.slice(0,7)};
      else{var isK=x.src.charAt(0)==='k';t={id:uid(),t:x.t,v:x.v,d:x.d,desc:x.desc,cat:x.newCat?made[x.t+'|'+norm(x.newCat)]:x.cat,conta:isK?'':x.src.slice(2),cartao:isK?x.src.slice(2):'',dest:'',pago:x.pago}}
      txPut(t);if(x.d>last)last=x.d;
    });
    if(Object.keys(made).length)mark('meta');setSrc(PL.cfg.src);PL=null;hold--;close();
    if(last&&last.slice(0,7)<=today().slice(0,7))cur=last.slice(0,7);go('transacoes');
    toast(it.length+' lançamento'+(it.length>1?'s importados':' importado')+'.');
  },
  xlsx:async function(){
    var all=allTx().sort(function(a,b){return a.d.localeCompare(b.d)});if(!all.length)return toast('Ainda não há transações para exportar.');
    try{var X=await loadXLSX()}catch(e){return toast('Não foi possível preparar o arquivo do Excel. Verifique a internet.')}
    var tn={d:'Despesa',r:'Receita',t:'Transferência',f:'Pagamento de fatura'};
    var rows=[['Data','Tipo','Descrição','Categoria','Conta ou cartão','Destino','Valor','Situação']].concat(all.map(function(t){return [t.d.slice(8,10)+'/'+t.d.slice(5,7)+'/'+t.d.slice(0,4),tn[t.t],t.desc||'',t.t==='d'||t.t==='r'?cat(t.cat).nome:'',t.t==='d'&&t.cartao?(cartao(t.cartao)||{}).nome||'':(conta(t.conta)||{}).nome||'',t.t==='t'?(conta(t.dest)||{}).nome||'':t.t==='f'?(cartao(t.cartao)||{}).nome||'':'',(t.t==='r'?1:-1)*t.v/100,t.cartao&&t.t==='d'?'Na fatura':t.pago?'Pago':'Pendente']}));
    var ws=X.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:11},{wch:18},{wch:32},{wch:18},{wch:18},{wch:16},{wch:12},{wch:11}];
    for(var i=1;i<rows.length;i++){var ref=X.utils.encode_cell({r:i,c:6});if(ws[ref])ws[ref].z='#,##0.00'}
    var wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,'Transações');
    var out=X.write(wb,{bookType:'xlsx',type:'array'});
    try{await saveFile({filename:'sproutfi-'+today()+'.xlsx',data:new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})});toast('Planilha do Excel salva.')}catch(e){if(!e||e.code!=='declined')toast('Não foi possível baixar a planilha agora.')}
  },
  modelo:async function(){
    try{var X=await loadXLSX()}catch(e){return toast('Não foi possível preparar o arquivo do Excel. Verifique a internet.')}
    var m=M(),cn=(m.contas[0]||{nome:'Nubank'}).nome,d=today(),br=function(x){return x.slice(8,10)+'/'+x.slice(5,7)+'/'+x.slice(0,4)};
    var rows=[['Data','Descrição','Valor','Categoria','Conta ou cartão','Situação'],[br(d),'Mercado',-154.9,'Alimentação',cn,'Pago'],[br(d),'Salário',3500,'Salário',cn,'Pago'],[br(dDay(5)),'Conta de luz',-180,'Moradia',cn,'Pendente'],[br(dDay(-2)),'Uber',-23.5,'Transporte',cn,'Pago']];
    var ws=X.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:11},{wch:28},{wch:12},{wch:18},{wch:18},{wch:11}];
    var ins=X.utils.aoa_to_sheet([['Como preencher'],['Data: dia/mês/ano.'],['Valor: negativo para despesa (ex.: -50,00) e positivo para receita.'],['Categoria: use os nomes das suas categorias. Nomes novos viram categorias novas.'],['Conta ou cartão: o nome igual ao cadastrado no SproutFi. Em branco, você escolhe na importação.'],['Situação: Pago ou Pendente. Em branco, datas passadas contam como pagas.']]);ins['!cols']=[{wch:90}];
    var wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,'Lançamentos');X.utils.book_append_sheet(wb,ins,'Como preencher');
    try{await saveFile({filename:'modelo-sproutfi.xlsx',data:new Blob([X.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})});toast('Planilha modelo salva.')}catch(e){}
  },
  csv:async function(){
    var all=allTx().sort(function(a,b){return a.d.localeCompare(b.d)});if(!all.length)return toast('Ainda não há transações para exportar.');
    
    var tn={d:'Despesa',r:'Receita',t:'Transferência',f:'Pagamento de fatura'},cell=function(s){return '"'+String(s==null?'':s).replace(/"/g,'""')+'"'};
    var rows=[['Data','Tipo','Descrição','Categoria','Conta ou cartão','Destino','Valor','Situação']].concat(all.map(function(t){return [t.d.slice(8,10)+'/'+t.d.slice(5,7)+'/'+t.d.slice(0,4),tn[t.t],t.desc||'',t.t==='d'||t.t==='r'?cat(t.cat).nome:'',t.t==='d'&&t.cartao?(cartao(t.cartao)||{}).nome||'':(conta(t.conta)||{}).nome||'',t.t==='t'?(conta(t.dest)||{}).nome||'':t.t==='f'?(cartao(t.cartao)||{}).nome||'':'',(t.v/100).toFixed(2).replace('.',','),t.cartao&&t.t==='d'?'Na fatura':t.pago?'Pago':'Pendente']}));
    var txt='﻿'+rows.map(function(r){return r.map(cell).join(';')}).join('\r\n');
    try{await saveFile({filename:'sproutfi-'+today()+'.csv',data:new Blob([txt],{type:'text/csv'})});toast('Planilha salva.')}catch(e){if(!e||e.code!=='declined')toast('Não foi possível baixar a planilha agora.')}
  }
};

(function(){var h=(location.hash||'').slice(1);if(h==='mais'||TABS.some(function(t){return t[0]===h}))tab=h})();
start();
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
