<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5e2410">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Gometis Doces – Custos</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdf3e6;--sf:#fff;--ink:#4a1d0c;--mut:#8a5a44;--ac:#9c4824;--acfg:#fff;--hd:#5e2410;--ok:#2f6b3a;--bad:#a83018;--ln:#f0d6b8;--chip:#fce4c0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#26120a;--sf:#35190e;--ink:#fce4c0;--mut:#d3a47e;--ac:#f0a566;--acfg:#3a1608;--hd:#fcd8b4;--ok:#9bd08a;--bad:#ff9a85;--ln:#5a2e1c;--chip:#4a2415}}
:root[data-theme="dark"]{--bg:#26120a;--sf:#35190e;--ink:#fce4c0;--mut:#d3a47e;--ac:#f0a566;--acfg:#3a1608;--hd:#fcd8b4;--ok:#9bd08a;--bad:#ff9a85;--ln:#5a2e1c;--chip:#4a2415}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 'Montserrat',system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 14px 90px}
h2{font-family:'Montserrat',system-ui,sans-serif;font-weight:700;margin:0;font-size:20px;margin:18px 0 8px;color:var(--hd)}
header{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--ln);border-radius:18px;padding:8px 16px;margin-bottom:6px;border-bottom:4px solid #a83018}header img{height:84px;width:auto;display:block}header h1{margin:0;color:#5e2410;font-family:'Montserrat',system-ui,sans-serif;font-size:clamp(24px,6.5vw,36px);font-weight:800;line-height:1.1}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 0;background:var(--bg)}
nav button{flex:0 0 auto;border:1px solid var(--ln);background:var(--sf);color:var(--ink);padding:8px 14px;border-radius:99px;font:inherit;font-weight:500;cursor:pointer}
nav button.on{background:var(--hd);color:var(--bg);border-color:var(--hd)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:3px;flex:1 1 110px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:9px;padding:9px;width:100%;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.btn{background:var(--ac);color:var(--acfg);border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.ghost{background:none;border:1px solid var(--ln);color:var(--mut);border-radius:9px;padding:7px 11px;font:inherit;cursor:pointer}
.card:has(.big){background:var(--chip)}.big{font-family:'Montserrat',system-ui,sans-serif;font-size:32px;font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px}.kpi small{color:var(--mut)}.kpi:first-child{background:var(--chip)}
.kpi b{display:block;font-size:19px;font-weight:700;font-family:'Montserrat',system-ui,sans-serif}
.pos{color:var(--ok)}.neg{color:var(--bad)}.mut{color:var(--mut);font-size:14px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:15px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--ln);white-space:nowrap}th{color:var(--mut);font-weight:500}
.empty{color:var(--mut);padding:18px 4px}
.line{display:flex;gap:6px;margin:6px 0;align-items:center}.line select{flex:2}.line input{flex:1}
.prog{height:10px;background:var(--ln);border-radius:9px;margin:10px 0 4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok)}
.bars{display:flex;gap:8px;align-items:flex-end;justify-content:space-around;min-height:130px}.bars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;flex:1;font-size:12px}.bars i{display:block;width:70%;max-width:44px;border-radius:6px 6px 0 0}.bars i.g{background:var(--ok)}.bars i.r{background:var(--bad)}.bars b{font-weight:600}
.badge{background:var(--chip);color:var(--bad);border-radius:9px;padding:8px 10px;margin:8px 0;font-size:14px;font-weight:600}
textarea{font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--ln);border-radius:9px;padding:9px;width:100%;margin-top:8px}
#t{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--hd);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90%;font-size:14px;text-align:center}#t.on{opacity:1}
</style>
</head>

<script>
var CF={mg:60,mn:30,hr:0,meta:0},S={ins:[],rec:[],ven:[],des:[],enc:[],pro:[],cfg:CF},tab='resumo',hoje=new Date().toISOString().slice(0,10),mes=hoje.slice(0,7),armed='',MN=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
try{var d=JSON.parse(localStorage.getItem('doces')||'null');if(d){S=Object.assign(S,d);S.cfg=Object.assign({},CF,d.cfg||{})}}catch(e){}
function save(){try{localStorage.setItem('doces',JSON.stringify(S))}catch(e){}}
var R=function(n){return (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})};
var N=function(n){return (n||0).toLocaleString('pt-BR',{maximumFractionDigits:2})};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var num=function(v){return parseFloat(String(v).replace(',','.'))||0};
var val=function(id){return document.getElementById(id).value};
var dbr=function(d){return d.split('-').reverse().join('/')};
function ins(id){return S.ins.find(function(x){return x.id===id})}
function rec(id){return S.rec.find(function(x){return x.id===id})}
function custoTotal(r){return r.l.reduce(function(a,l){var i=ins(l.i);return a+(i&&i.q>0?l.q*i.p/i.q:0)},0)+(+r.ex||0)+(r.t||0)/60*S.cfg.hr}
function custoUn(r){return r.n>0?custoTotal(r)/r.n:0}
function sug(r){var m=Math.min(S.cfg.mg,95);return custoUn(r)/(1-m/100)}
function toast(m){var t=document.getElementById('t');t.textContent=m;t.className='on';clearTimeout(toast.k);toast.k=setTimeout(function(){t.className=''},3200)}
function go(t){tab=t;draw()}
function set(l,i,k,v,n){S[l][i][k]=n?num(v):v;save();draw()}
function cf(k,v){S.cfg[k]=num(v);save();draw()}
function del(l,i){var a=l+i;if(armed===a){armed='';S[l].splice(i,1);save();draw()}else{armed=a;toast('Toque de novo em ✕ para excluir');setTimeout(function(){armed=''},3000)}}

function addIns(){var n=val('in').trim(),p=num(val('ip')),q=num(val('iq')),u=val('iu').trim()||'un';if(!n||p<=0||q<=0)return toast('Preencha nome, preço pago e quantidade da embalagem.');S.ins.push({id:uid(),n:n,p:p,q:q,u:u,e:0,mi:0});save();draw()}
function addRec(){var n=val('rn').trim();if(!n)return toast('Dê um nome ao doce.');S.rec.push({id:uid(),n:1,nome:n,pv:0,ex:0,t:0,l:[]});save();draw()}
function addLine(i){var s=val('sel'+i);if(!s)return;S.rec[i].l.push({i:s,q:1});save();draw()}
function delLine(i,j){S.rec[i].l.splice(j,1);save();draw()}
function setLine(i,j,k,v){S.rec[i].l[j][k]=k==='q'?num(v):v;save();draw()}
function setPV(i){S.rec[i].pv=Math.ceil(sug(S.rec[i])*100)/100;save();draw()}
function addVen(){var r=rec(val('vr')),q=num(val('vq')),dt=val('vd');if(!r||q<=0||!dt)return toast('Escolha o doce, a data e a quantidade.');var pu=num(val('vp'))||r.pv;S.ven.push({id:uid(),d:dt,r:r.id,nome:r.nome,q:q,pu:pu,cu:custoUn(r),cli:val('vc').trim(),ar:val('vf')==='1'?pu*q:0});save();draw()}
function receber(i){S.ven[i].ar=0;save();draw()}
function addDes(){var n=val('dn').trim(),v=num(val('dv')),dt=val('dd');if(!n||v<=0||!dt)return toast('Preencha descrição, valor e data.');S.des.push({id:uid(),d:dt,n:n,v:v});save();draw()}
function addPro(){var r=rec(val('pr')),q=num(val('pq')),pd=num(val('pp')),dt=val('pd');if(!r||q+pd<=0||!dt)return toast('Escolha o doce, a data e as quantidades.');var f=(q+pd)/(r.n||1);r.l.forEach(function(l){var i=ins(l.i);if(i)i.e=Math.round(((i.e||0)-l.q*f)*100)/100});S.pro.push({id:uid(),d:dt,nome:r.nome,q:q,pd:pd,perda:pd*custoUn(r)});save();draw();toast('Produção registrada e estoque atualizado.')}
function addEnc(){var r=rec(val('er')),q=num(val('eq')),dt=val('ed'),cl=val('ec').trim();if(!r||q<=0||!dt||!cl)return toast('Preencha cliente, doce, quantidade e data de entrega.');S.enc.push({id:uid(),cli:cl,r:r.id,nome:r.nome,q:q,d:dt,v:num(val('ev'))||q*r.pv,s:num(val('es')),ok:0});save();draw()}
function entregar(i){var o=S.enc[i],r=rec(o.r);S.ven.push({id:uid(),d:hoje,r:o.r,nome:o.nome,q:o.q,pu:o.v/o.q,cu:r?custoUn(r):0,cli:o.cli,ar:Math.max(0,o.v-o.s)});o.ok=1;save();draw();toast('Entrega registrada como venda.')}
function gerar(){document.getElementById('bk').value=JSON.stringify(S)}
function copiar(){var t=document.getElementById('bk');if(!t.value)gerar();t.select();var ok=false;try{ok=document.execCommand('copy')}catch(e){}toast(ok?'Backup copiado.':'Texto selecionado: copie manualmente.')}
function restaurar(){var t=val('rs').trim();try{var o=JSON.parse(t);if(!o||!Array.isArray(o.ins)||!Array.isArray(o.rec))throw 0;if(armed!=='rst'){armed='rst';toast('Isso substitui os dados atuais. Toque de novo para confirmar.');return}armed='';S=Object.assign({ins:[],rec:[],ven:[],des:[],enc:[],pro:[]},o);S.cfg=Object.assign({},CF,o.cfg||{});save();draw();toast('Backup restaurado.')}catch(e){toast('Backup inválido. Cole o texto completo.')}}

function RM(m){var o={rv:0,cv:0,un:0,dv:0,pd:0,by:{}};S.ven.filter(function(v){return v.d.slice(0,7)===m}).forEach(function(v){o.rv+=v.pu*v.q;o.cv+=v.cu*v.q;o.un+=v.q;var b=o.by[v.nome]||(o.by[v.nome]={q:0,r:0,l:0});b.q+=v.q;b.r+=v.pu*v.q;b.l+=(v.pu-v.cu)*v.q});S.des.forEach(function(x){if(x.d.slice(0,7)===m)o.dv+=x.v});S.pro.forEach(function(x){if(x.d.slice(0,7)===m)o.pd+=x.perda});o.liq=o.rv-o.cv-o.dv-o.pd;return o}

function vRes(){var o=RM(mes),h=`<div class="row" style="margin:8px 0"><label style="max-width:200px">Mês<input type="month" value="${mes}" onchange="mes=this.value||mes;draw()"></label></div><div class="card"><small class="mut">Lucro líquido do mês</small><div class="big ${o.liq>=0?'pos':'neg'}">${R(o.liq)}</div><span class="mut">Vendas − custo dos doces − despesas − perdas</span>`;
if(S.cfg.meta>0){var p=Math.max(0,Math.min(100,o.liq/S.cfg.meta*100));h+=`<div class="prog"><i style="width:${p}%"></i></div><span class="mut">Meta de ${R(S.cfg.meta)}: ${N(p)}% atingido</span>`}
h+=`</div><div class="kpis"><div class="kpi"><small>Faturamento</small><b>${R(o.rv)}</b></div><div class="kpi"><small>Custo dos doces vendidos</small><b>${R(o.cv)}</b></div><div class="kpi"><small>Outras despesas</small><b>${R(o.dv)}</b></div><div class="kpi"><small>Perdas na produção</small><b>${R(o.pd)}</b></div><div class="kpi"><small>Unidades vendidas</small><b>${N(o.un)}</b></div><div class="kpi"><small>A receber (fiado)</small><b>${R(S.ven.reduce(function(a,v){return a+(v.ar||0)},0))}</b></div></div>`;
var ym=mes.split('-'),L=[],mx=1;for(var k=5;k>=0;k--){var mm=+ym[1]-1-k,yy=+ym[0]+Math.floor(mm/12);mm=(mm%12+12)%12;var key=yy+'-'+String(mm+1).padStart(2,'0'),l=RM(key).liq;L.push({m:MN[mm],l:l});mx=Math.max(mx,Math.abs(l))}
h+='<h2>Lucro dos últimos 6 meses</h2><div class="card bars">'+L.map(function(x){return `<div><span class="mut">${N(x.l)}</span><i class="${x.l>=0?'g':'r'}" style="height:${Math.max(3,Math.abs(x.l)/mx*80)}px"></i><b>${x.m}</b></div>`}).join('')+'</div>';
var low=S.ins.filter(function(i){return i.mi>0&&(i.e||0)<=i.mi});if(low.length)h+=`<div class="card"><b class="neg">Estoque baixo:</b> ${low.map(function(i){return esc(i.n)+' ('+N(i.e)+' '+esc(i.u)+')'}).join(', ')}</div>`;
var ks=Object.keys(o.by);if(!ks.length)return h+'<div class="empty">Sem vendas neste mês. Registre em Vendas para ver o resumo por doce.</div>';
h+='<h2>Por doce</h2><div class="card tw"><table><tr><th>Doce</th><th>Qtd.</th><th>Faturou</th><th>Lucro</th></tr>';
ks.sort(function(a,b){return o.by[b].l-o.by[a].l}).forEach(function(k){var b=o.by[k];h+=`<tr><td>${esc(k)}</td><td>${N(b.q)}</td><td>${R(b.r)}</td><td class="${b.l>=0?'pos':'neg'}">${R(b.l)}</td></tr>`});return h+'</table></div>'}

function opts(sel){return S.rec.map(function(r){return `<option value="${r.id}">${esc(r.nome)}</option>`}).join('')}
function noRec(){return '<div class="card"><div class="empty">Cadastre um doce em Receitas primeiro.</div></div>'}

function vVen(){var h='<h2>Vendas</h2>';if(!S.rec.length)return h+noRec();
h+=`<div class="card"><div class="row"><label>Data<input id="vd" type="date" value="${hoje}"></label><label style="flex:2">Doce<select id="vr" onchange="var r=rec(this.value);document.getElementById('vp').value=r.pv||''">${opts()}</select></label><label>Qtd.<input id="vq" inputmode="decimal"></label><label>Preço/un.<input id="vp" inputmode="decimal" value="${S.rec[0].pv||''}"></label><label>Cliente<input id="vc" placeholder="opcional"></label><label>Pagamento<select id="vf"><option value="0">Pago</option><option value="1">Fiado</option></select></label><button class="btn" onclick="addVen()">Registrar</button></div></div>`;
var L=S.ven.map(function(v,i){return{v:v,i:i}}).sort(function(a,b){return b.v.d.localeCompare(a.v.d)});if(!L.length)return h+'<div class="empty">Nenhuma venda registrada.</div>';
h+='<div class="card tw"><table><tr><th>Data</th><th>Doce</th><th>Qtd.</th><th>Receita</th><th>Lucro</th><th>Cliente</th><th></th></tr>';
L.forEach(function(o){var v=o.v,lu=(v.pu-v.cu)*v.q;h+=`<tr><td>${dbr(v.d)}</td><td>${esc(v.nome)}</td><td>${N(v.q)}</td><td>${R(v.pu*v.q)}</td><td class="${lu>=0?'pos':'neg'}">${R(lu)}</td><td>${esc(v.cli||'')} ${v.ar>0?`<button class="ghost" onclick="receber(${o.i})">Recebi ${R(v.ar)}</button>`:''}</td><td><button class="ghost" onclick="del('ven',${o.i})">✕</button></td></tr>`});return h+'</table></div>'}

function vEnc(){var h='<h2>Encomendas</h2>';if(!S.rec.length)return h+noRec();
h+=`<div class="card"><div class="row"><label>Cliente<input id="ec"></label><label style="flex:2">Doce<select id="er">${opts()}</select></label><label>Qtd.<input id="eq" inputmode="decimal"></label><label>Entrega<input id="ed" type="date" value="${hoje}"></label><label>Valor total<input id="ev" inputmode="decimal" placeholder="auto"></label><label>Sinal pago<input id="es" inputmode="decimal" value="0"></label><button class="btn" onclick="addEnc()">Adicionar</button></div></div>`;
var L=S.enc.map(function(v,i){return{v:v,i:i}}).sort(function(a,b){return a.v.ok-b.v.ok||a.v.d.localeCompare(b.v.d)});if(!L.length)return h+'<div class="empty">Nenhuma encomenda. Cadastre os pedidos para festas e datas especiais.</div>';
var ab=S.enc.filter(function(o){return !o.ok}).reduce(function(a,o){return a+o.v-o.s},0);
h+=`<p class="mut">Falta receber das encomendas pendentes: <b>${R(ab)}</b></p><div class="card tw"><table><tr><th>Entrega</th><th>Cliente</th><th>Pedido</th><th>Valor</th><th>Falta</th><th></th></tr>`;
L.forEach(function(o){var v=o.v,late=!v.ok&&v.d<hoje;h+=`<tr style="${v.ok?'opacity:.55':''}"><td class="${late?'neg':''}">${dbr(v.d)}</td><td>${esc(v.cli)}</td><td>${N(v.q)}× ${esc(v.nome)}</td><td>${R(v.v)}</td><td>${R(v.v-v.s)}</td><td>${v.ok?'Entregue':`<button class="ghost" onclick="entregar(${o.i})">Entregue</button>`} <button class="ghost" onclick="del('enc',${o.i})">✕</button></td></tr>`});return h+'</table></div>'}

function vIns(){var h=`<h2>Insumos e estoque</h2><p class="mut">Cadastre o que você compra. O estoque diminui sozinho quando você registra uma produção.</p><div class="card"><div class="row"><label>Nome<input id="in" placeholder="Leite condensado"></label><label>Preço pago (R$)<input id="ip" inputmode="decimal"></label><label>Qtd. na embalagem<input id="iq" inputmode="decimal"></label><label>Unidade<input id="iu" placeholder="g, ml, un"></label><button class="btn" onclick="addIns()">Adicionar</button></div></div>`;
if(!S.ins.length)return h+'<div class="empty">Nenhum insumo ainda. Comece pelo leite condensado, chocolate, caixinhas…</div>';
h+='<div class="card tw"><table><tr><th>Insumo</th><th>Preço</th><th>Embalagem</th><th>Custo/un.</th><th>Estoque</th><th>Avisar em</th><th></th></tr>';
S.ins.forEach(function(x,i){var lo=x.mi>0&&(x.e||0)<=x.mi;h+=`<tr><td>${esc(x.n)}</td><td><input style="width:80px" value="${x.p}" onchange="set('ins',${i},'p',this.value,1)"></td><td><input style="width:70px" value="${x.q}" onchange="set('ins',${i},'q',this.value,1)"> ${esc(x.u)}</td><td>${R(x.p/x.q)}/${esc(x.u)}</td><td><input style="width:80px" class="${lo?'neg':''}" value="${x.e||0}" onchange="set('ins',${i},'e',this.value,1)"></td><td><input style="width:70px" value="${x.mi||0}" onchange="set('ins',${i},'mi',this.value,1)"></td><td><button class="ghost" onclick="del('ins',${i})">✕</button></td></tr>`});return h+'</table></div>'}

function vRec(){var h=`<h2>Receitas e preços</h2><p class="mut">Monte o doce, informe o rendimento e veja custo, lucro e o preço sugerido para a margem que você quer (hoje: ${N(S.cfg.mg)}%, em Ajustes).</p><div class="card"><div class="row"><label>Nome do doce<input id="rn" placeholder="Brigadeiro gourmet"></label><button class="btn" onclick="addRec()">Criar doce</button></div></div>`;
if(!S.rec.length)return h+'<div class="empty">Crie seu primeiro doce. Depois adicione os ingredientes dele.</div>';
S.rec.forEach(function(r,i){var c=custoUn(r),lu=r.pv-c,m=r.pv>0?lu/r.pv*100:0;
h+=`<div class="card"><div class="row"><label style="flex:2">Doce<input value="${esc(r.nome)}" onchange="set('rec',${i},'nome',this.value)"></label><label>Rende (un.)<input inputmode="decimal" value="${r.n}" onchange="set('rec',${i},'n',this.value,1)"></label><label>Outros custos (R$)<input inputmode="decimal" value="${r.ex}" onchange="set('rec',${i},'ex',this.value,1)"></label><label>Preparo (min)<input inputmode="decimal" value="${r.t||0}" onchange="set('rec',${i},'t',this.value,1)"></label><label>Preço de venda/un.<input inputmode="decimal" value="${r.pv}" onchange="set('rec',${i},'pv',this.value,1)"></label></div>`;
r.l.forEach(function(l,j){var x=ins(l.i);h+=`<div class="line"><select onchange="setLine(${i},${j},'i',this.value)">${S.ins.map(function(o){return `<option value="${o.id}"${o.id===l.i?' selected':''}>${esc(o.n)}</option>`}).join('')}</select><input inputmode="decimal" value="${l.q}" onchange="setLine(${i},${j},'q',this.value)" aria-label="Quantidade usada"><span class="mut">${x?esc(x.u):''}</span><button class="ghost" onclick="delLine(${i},${j})">✕</button></div>`});
h+=S.ins.length?`<div class="line"><select id="sel${i}"><option value="">Adicionar ingrediente…</option>${S.ins.map(function(o){return `<option value="${o.id}">${esc(o.n)}</option>`}).join('')}</select><button class="ghost" onclick="addLine(${i})">Incluir</button></div>`:'<p class="mut">Cadastre insumos primeiro.</p>';
if(r.pv>0&&m<S.cfg.mn)h+=`<p class="badge">⚠ Margem de ${N(m)}%, abaixo do mínimo de ${N(S.cfg.mn)}%. Considere reajustar o preço.</p>`;
h+=`<div class="kpis" style="margin-top:10px"><div class="kpi"><small>Custo por unidade</small><b>${R(c)}</b></div><div class="kpi"><small>Preço sugerido</small><b>${R(sug(r))}</b></div><div class="kpi"><small>Lucro por unidade</small><b class="${lu>=0?'pos':'neg'}">${R(lu)}</b></div><div class="kpi"><small>Margem</small><b class="${m>=0?'pos':'neg'}">${N(m)}%</b></div></div><p style="margin:10px 0 0"><button class="ghost" onclick="setPV(${i})">Usar preço sugerido</button> <button class="ghost" onclick="del('rec',${i})">Excluir doce</button></p></div>`});return h}

function vPro(){var h='<h2>Produção</h2><p class="mut">Registre o que você fez e o que se perdeu. O estoque dos insumos é descontado e as perdas entram no lucro.</p>';if(!S.rec.length)return h+noRec();
h+=`<div class="card"><div class="row"><label>Data<input id="pd" type="date" value="${hoje}"></label><label style="flex:2">Doce<select id="pr">${opts()}</select></label><label>Unidades boas<input id="pq" inputmode="decimal"></label><label>Perdidas<input id="pp" inputmode="decimal" value="0"></label><button class="btn" onclick="addPro()">Registrar</button></div></div>`;
var L=S.pro.map(function(v,i){return{v:v,i:i}}).sort(function(a,b){return b.v.d.localeCompare(a.v.d)});if(!L.length)return h+'<div class="empty">Nenhuma produção registrada.</div>';
h+='<div class="card tw"><table><tr><th>Data</th><th>Doce</th><th>Feitos</th><th>Perdidos</th><th>Custo da perda</th><th></th></tr>';
L.forEach(function(o){var v=o.v;h+=`<tr><td>${dbr(v.d)}</td><td>${esc(v.nome)}</td><td>${N(v.q)}</td><td>${N(v.pd)}</td><td class="${v.perda>0?'neg':''}">${R(v.perda)}</td><td><button class="ghost" onclick="del('pro',${o.i})">✕</button></td></tr>`});return h+'</table></div><p class="mut">Excluir um registro não devolve o estoque; ajuste em Insumos se precisar.</p>'}

function vDes(){var h=`<h2>Outras despesas</h2><p class="mut">Gás, entrega, taxas, embalagens avulsas e tudo que não está nas receitas.</p><div class="card"><div class="row"><label>Data<input id="dd" type="date" value="${hoje}"></label><label style="flex:2">Descrição<input id="dn" placeholder="Gás de cozinha"></label><label>Valor (R$)<input id="dv" inputmode="decimal"></label><button class="btn" onclick="addDes()">Adicionar</button></div></div>`;
var L=S.des.map(function(v,i){return{v:v,i:i}}).sort(function(a,b){return b.v.d.localeCompare(a.v.d)});if(!L.length)return h+'<div class="empty">Nenhuma despesa registrada.</div>';
h+='<div class="card tw"><table><tr><th>Data</th><th>Descrição</th><th>Valor</th><th></th></tr>';
L.forEach(function(o){h+=`<tr><td>${dbr(o.v.d)}</td><td>${esc(o.v.n)}</td><td>${R(o.v.v)}</td><td><button class="ghost" onclick="del('des',${o.i})">✕</button></td></tr>`});return h+'</table></div>'}

function vCfg(){var c=S.cfg;return `<h2>Ajustes</h2><div class="card"><div class="row"><label>Margem de lucro desejada (%)<input inputmode="decimal" value="${c.mg}" onchange="cf('mg',this.value)"></label><label>Margem mínima para alerta (%)<input inputmode="decimal" value="${c.mn}" onchange="cf('mn',this.value)"></label><label>Valor da sua hora (R$)<input inputmode="decimal" value="${c.hr}" onchange="cf('hr',this.value)"></label><label>Meta de lucro por mês (R$)<input inputmode="decimal" value="${c.meta}" onchange="cf('meta',this.value)"></label></div><p class="mut">O valor da hora é somado ao custo de cada receita pelo tempo de preparo. Deixe 0 se não quiser contar seu trabalho.</p></div>
<h2>Backup</h2><p class="mut">Seus dados ficam só neste aparelho. Gere o backup, copie e guarde em um lugar seguro. Para trocar de aparelho, cole o texto na restauração.</p><div class="card"><div class="row"><button class="btn" onclick="gerar()">Gerar backup</button><button class="ghost" onclick="copiar()">Copiar</button></div><textarea id="bk" rows="3" readonly></textarea></div><div class="card"><label>Restaurar a partir de um backup<textarea id="rs" rows="3" placeholder="Cole aqui o texto do backup"></textarea></label><p style="margin:8px 0 0"><button class="btn" onclick="restaurar()">Restaurar</button></p></div>`}

var T=[['resumo','Resumo',vRes],['vendas','Vendas',vVen],['enc','Encomendas',vEnc],['rec','Receitas',vRec],['ins','Insumos',vIns],['pro','Produção',vPro],['des','Despesas',vDes],['cfg','Ajustes',vCfg]];
function draw(){document.getElementById('nav').innerHTML=T.map(function(t){return `<button class="${t[0]===tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`}).join('');document.getElementById('v').innerHTML=T.find(function(t){return t[0]===tab})[2]()}
draw();
</script>

<script>if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})</script>
</body>
</html>
